services:
  db:
    image: postgres:16-alpine
    container_name: what_oil_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatoil
      POSTGRES_USER: whatoil
      POSTGRES_PASSWORD: whatoil # pragma: allowlist secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - what_oil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatoil -d whatoil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  what_oil_pgdata:
